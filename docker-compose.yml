version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thedevbacklog_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /home/craigpar/Code:/home/craigpar/Code
    depends_on:
      - db
      - redis
    networks:
      - devbacklog
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "projects.elasticgun.com:host-gateway"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: thedevbacklog
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      QAQUEUE_BASE_URL: http://host.docker.internal:8008
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: elasticgun-reverb-app
      REVERB_APP_KEY: elasticgun-reverb-key
      REVERB_APP_SECRET: elasticgun-reverb-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_WS_PATH: /app

  web:
    image: nginx:alpine
    container_name: thedevbacklog_web
    restart: unless-stopped
    ports:
      - "8485:80"
    volumes:
      - ./:/var/www
      - /home/craigpar/Code:/home/craigpar/Code
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - devbacklog

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thedevbacklog_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
    networks:
      - devbacklog
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "projects.elasticgun.com:host-gateway"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: thedevbacklog
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      QAQUEUE_BASE_URL: http://host.docker.internal:8008
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: elasticgun-reverb-app
      REVERB_APP_KEY: elasticgun-reverb-key
      REVERB_APP_SECRET: elasticgun-reverb-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_WS_PATH: /app

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thedevbacklog_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
    networks:
      - devbacklog
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: thedevbacklog
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_ID: elasticgun-reverb-app
      REVERB_APP_KEY: elasticgun-reverb-key
      REVERB_APP_SECRET: elasticgun-reverb-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

  db:
    image: mysql:8.0
    container_name: thedevbacklog_db
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: thedevbacklog
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - devbacklog_dbdata:/var/lib/mysql
    networks:
      - devbacklog

  redis:
    image: redis:alpine
    container_name: thedevbacklog_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    networks:
      - devbacklog

volumes:
  devbacklog_dbdata:


networks:
  devbacklog:
    driver: bridge
